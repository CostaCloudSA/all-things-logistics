<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Campabadal Global Logistics - Fortified Enterprise Multi-Agent Customs Compliance Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Campabadal Global Logistics | Fortified Enterprise Fleet</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0f1d;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #0a0f1d;
      transition: opacity 0.3s ease-out;
      z-index: 99999;
      position: fixed;
      top: 0;
      left: 0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .title-text {
      margin-top: 16px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .sub-text {
      margin-top: 6px;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #94a3b8;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title-text">Campabadal Global Logistics</div>
    <div class="sub-text">Initializing Fortified Enterprise Multi-Agent Swarm...</div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js and initialize engine
      if (window._flutter && window._flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: {{flutter_service_worker_version}},
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              var loader = document.getElementById('loading-container');
              if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() {
                  if (loader && loader.parentNode) {
                    loader.parentNode.removeChild(loader);
                  }
                }, 300);
              }
              appRunner.runApp();
            });
          }
        });
      } else {
        // Fallback for direct script loading
        var script = document.createElement('script');
        script.src = 'main.dart.js';
        script.type = 'application/javascript';
        document.body.appendChild(script);
      }
    });
  </script>
</body>
</html>
