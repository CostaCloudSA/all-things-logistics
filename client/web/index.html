<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Campabadal Global Logistics - Fortified Enterprise Multi-Agent Customs Compliance Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Campabadal Global Logistics | Fortified Enterprise Fleet</title>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #070B14;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #070B14;
      transition: opacity 0.3s ease-out;
      z-index: 99999;
      position: fixed;
      top: 0;
      left: 0;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #0284C7;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .title-text {
      margin-top: 18px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1.2px;
      color: #38BDF8;
      text-transform: uppercase;
    }
    .sub-text {
      margin-top: 6px;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #94A3B8;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title-text">Campabadal Global Logistics</div>
    <div class="sub-text">Loading Multi-Device Operations Hub...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
